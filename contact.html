<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    nav{
      background-color: #182848;
    }
  </style>
</head>
<body class="bg-gray-100 flex flex-col min-h-screen">

  <!-- Navbar -->
  <nav class="shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="index.html" class="flex items-center space-x-3">
        <img src="images/images (1).jpg" alt="Logo" class="h-10 w-auto rounded">
        <!-- <span class="text-xl font-bold text-gray-800">AI-PrepHub</span> -->
      </a>
      <div class="space-x-6 text-sm font-medium text-white hidden md:flex">
        <a href="index.html" class="hover:text-indigo-500">Home</a>
        <a href="About Us.html" class="hover:text-indigo-500">About Us</a>
        <a href="contact.html" class="text-indigo-600 font-semibold">Contact Us</a>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="bg-indigo-50 py-16 text-center">
    <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mb-4">AI-powered Interview Preparation Platform</h1>
    <div class="max-w-md mx-auto">
      <div class="flex rounded-md shadow-sm">
        <input type="text" class="flex-grow px-4 py-2 rounded-l-md border border-gray-300 focus:outline-none" placeholder="Enter your email">
        <button class="px-6 py-2 bg-indigo-600 text-white rounded-r-md hover:bg-indigo-700">Subscribe</button>
      </div>
    </div>
  </section>

  <!-- Contact Form -->
  <main class="flex-1">
    <section class="py-16 bg-white">
      <div class="max-w-4xl mx-auto px-6">
        <h2 class="text-3xl font-bold text-center text-gray-800 mb-10">Get In Touch</h2>
        <form class="space-y-6 bg-gray-50 p-8 rounded-lg shadow-md">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <input type="text" placeholder="Name" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500">
            <input type="tel" placeholder="Phone" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500">
            <input type="email" placeholder="Email" class="w-full px-4 py-2 border border-gray-300 rounded-md md:col-span-2 focus:ring-2 focus:ring-indigo-500">
          </div>
          <textarea rows="5" placeholder="Message" class="w-full px-4 py-2 border border-gray-300 rounded-md resize-none focus:ring-2 focus:ring-indigo-500"></textarea>
          <div class="text-center">
            <button type="submit" class="px-8 py-3 bg-indigo-600 text-white rounded-md text-lg hover:bg-indigo-700 transition">Send</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="bg-gray-900 text-white py-10">
    <div class="max-w-6xl mx-auto px-6 text-center">
      <h2 class="text-xl font-semibold mb-4">Call Now: +01 123467890</h2>
      <p class="mb-4">Email: AI@gmail.com</p>
      <div class="flex justify-center space-x-6 mb-6">
        <a href="#" class="hover:text-indigo-400"><i class="fa fa-facebook"></i></a>
        <a href="#" class="hover:text-indigo-400"><i class="fa fa-twitter"></i></a>
        <a href="#" class="hover:text-indigo-400"><i class="fa fa-linkedin"></i></a>
        <a href="#" class="hover:text-indigo-400"><i class="fa fa-instagram"></i></a>
      </div>
      <p class="text-sm">&copy; 2025 All Rights Reserved. Design by <a href="#" class="text-indigo-400 underline">AI-PrepHub</a></p>
    </div>
  </footer>

</body>
</html>
